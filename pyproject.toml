[project]
name = "syn-digits"
version = "1.0.0"
requires-python = ">=3.10"
description = "Code and data for SYN-DIGITS: A Synthetic Control Framework for Calibrated Digital Twin Simulation"
authors = [{name = "Yuhang Wu", email = "yuhang.wu@columbia.edu"}, {name = "Grace Jiarui Fan", email = "jf3677@columbia.edu"}]
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "joblib>=1.3",
    "ipykernel>=6.30.1",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.1",
    "matplotlib>=3.10.5",
    "causaltensor>=0.1.12",
    "torch>=2.0",
]
